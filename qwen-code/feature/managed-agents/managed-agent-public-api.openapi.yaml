openapi: 3.1.0
info:
  title: Qwen Managed Agent Public and WebShell API
  version: 1.9.0
  description: >-
    Canonical contract for the public Managed Agent resources and the WebShell
    adapter. partial means that the route exists but generated types and full
    contract tests are pending; planned means that the route or field is not implemented.
    Workspace context and cwd operations are v1.9 target contracts, not current
    server capabilities. Filter planned fields as well as routes from production SDKs.
servers:
  - url: /
security:
  - trustedTenant: []
tags:
  - name: Public Sessions
  - name: Public Resources
  - name: WebShell
paths:
  /v1/agents:
    post:
      tags: [Public Resources]
      operationId: createAgent
      x-qwen-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionRequest'
      responses:
        '202':
          description: Immutable agent revision published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinition'
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      tags: [Public Resources]
      operationId: getAgent
      x-qwen-implementation-status: planned
      parameters:
        - name: revision
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Requested or current agent revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinition'
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Public Resources]
      operationId: updateAgent
      x-qwen-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDefinitionRequest'
      responses:
        '202':
          description: New immutable revision published for this agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDefinition'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/agents/sessions:
    post:
      tags: [Public Sessions]
      operationId: createSession
      x-qwen-implementation-status: partial
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '202':
          description: Session accepted after durable command admission.
          headers:
            X-Qwen-Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Public Sessions]
      operationId: listSessions
      x-qwen-implementation-status: partial
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Sessions ordered by updated_at and id descending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSessionList'
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/agents/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Public Sessions]
      operationId: getSession
      x-qwen-implementation-status: partial
      responses:
        '200':
          description: Session state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSession'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Public Sessions]
      operationId: deleteSession
      x-qwen-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Durable deletion or archival workflow accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAdmission'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/agents/sessions/{sessionId}/events:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Public Sessions]
      operationId: postSessionEvent
      x-qwen-implementation-status: partial
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEventRequest'
      responses:
        '202':
          description: Input or cancellation durably accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAdmission'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Public Sessions]
      operationId: getSessionEvents
      x-qwen-implementation-status: partial
      description: >-
        Returns JSON by default. Accept text/event-stream or stream=true to
        receive SSE. Last-Event-ID takes precedence over after.
      parameters:
        - $ref: '#/components/parameters/AfterSequence'
        - $ref: '#/components/parameters/EventLimit'
        - name: stream
          in: query
          schema: { type: boolean, default: false }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Event page or SSE stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventList'
            text/event-stream:
              schema:
                type: string
                description: SSE frames whose id is the public sequence.
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CursorExpired' }
  /v1/agents/sessions/{sessionId}/turns:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Public Resources]
      operationId: listTurns
      x-qwen-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Turn page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTurnList'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/agents/sessions/{sessionId}/turns/{turnId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/TurnId'
    get:
      tags: [Public Resources]
      operationId: getTurn
      x-qwen-implementation-status: planned
      responses:
        '200':
          description: Turn state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTurn'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/agents/sessions/{sessionId}/items:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Public Resources]
      operationId: listItems
      x-qwen-implementation-status: partial
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Materialized items and snapshot watermark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicItemList'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/agents/sessions/{sessionId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Public Resources]
      operationId: listArtifacts
      x-qwen-implementation-status: planned
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Artifact metadata page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArtifactList'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/agents/sessions/{sessionId}/artifacts/{artifactId}/content:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [Public Resources]
      operationId: getArtifactContent
      x-qwen-implementation-status: planned
      responses:
        '200':
          description: Authorized artifact bytes with integrity metadata.
          headers:
            Digest:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent/web-shell/v1/sessions/query:
    post:
      tags: [WebShell]
      operationId: webShellListSessions
      x-qwen-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellListRequest'
      responses:
        '200':
          description: WebShell session page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellSessionPage'
  /api/agent/web-shell/v1/sessions/get:
    post:
      tags: [WebShell]
      operationId: webShellGetSession
      x-qwen-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellSessionRequest'
      responses:
        '200':
          description: WebShell session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellSession'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent/web-shell/v1/transcript/query:
    post:
      tags: [WebShell]
      operationId: webShellTranscript
      x-qwen-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellTranscriptRequest'
      responses:
        '200':
          description: Event transcript page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellTranscript'
  /api/agent/web-shell/v1/events/stream:
    post:
      tags: [WebShell]
      operationId: webShellStreamEvents
      x-qwen-implementation-status: partial
      description: POST SSE consumed through fetch response.body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellStreamRequest'
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        '409': { $ref: '#/components/responses/CursorExpired' }
  /api/agent/web-shell/v1/sessions/create:
    post:
      tags: [WebShell]
      operationId: webShellCreateSession
      x-qwen-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellCreateRequest'
      responses:
        '202':
          description: Session admitted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellAdmission'
        '409': { $ref: '#/components/responses/Conflict' }
  /api/agent/web-shell/v1/turns/submit:
    post:
      tags: [WebShell]
      operationId: webShellSubmitTurn
      x-qwen-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellSubmitRequest'
      responses:
        '202':
          description: Turn admitted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellAdmission'
        '409': { $ref: '#/components/responses/Conflict' }
  /api/agent/web-shell/v1/turns/cancel:
    post:
      tags: [WebShell]
      operationId: webShellCancelTurn
      x-qwen-implementation-status: partial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellCancelRequest'
      responses:
        '202':
          description: Cancellation durably admitted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellAdmission'
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/agents/workspaces:
    get:
      tags:
      - Public Resources
      operationId: listWorkspaces
      x-qwen-implementation-status: planned
      description: Only authorized preregistered workspaces, ordered by stable workspace id. Opaque cursors are
        bound to tenant and filters; no physical paths are exposed.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: Authorized durable resource view; no Runtime startup required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorkspaceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/workspaces/{workspaceId}:
    parameters:
    - name: workspaceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    get:
      tags:
      - Public Resources
      operationId: getWorkspace
      x-qwen-implementation-status: planned
      responses:
        '200':
          description: Authorized durable resource view; no Runtime startup required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicWorkspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/agents/sessions/{sessionId}/cwd:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    post:
      tags:
      - Public Sessions
      operationId: changeSessionCwd
      x-qwen-implementation-status: planned
      description: 'W2: same-workspace only. Replay the original operation before revision/busy checks. Reject
        active or queued input and context holds. Poll the operation or await session.context.changed; do not
        treat 202 as activation.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCwdRequest'
      responses:
        '202':
          description: Durable cwd operation; acceptance does not mean the new cwd is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCwdOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/agents/sessions/{sessionId}/operations/{operationId}:
    parameters:
    - $ref: '#/components/parameters/SessionId'
    - name: operationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    get:
      tags:
      - Public Sessions
      operationId: getSessionCwdOperation
      x-qwen-implementation-status: planned
      responses:
        '200':
          description: Authorized durable resource view; no Runtime startup required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCwdOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agent/web-shell/v1/workspaces/query:
    post:
      tags:
      - WebShell
      operationId: webShellQueryWorkspaces
      x-qwen-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellListRequest'
      responses:
        '200':
          description: Authorized durable resource view; no Runtime startup required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellWorkspacePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agent/web-shell/v1/sessions/cwd/change:
    post:
      tags:
      - WebShell
      operationId: webShellChangeCwd
      x-qwen-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellChangeCwdRequest'
      responses:
        '202':
          description: Durable cwd operation; acceptance does not mean the new cwd is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellCwdOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/agent/web-shell/v1/operations/query:
    post:
      tags:
      - WebShell
      operationId: webShellQueryCwdOperation
      x-qwen-implementation-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebShellOperationRequest'
      responses:
        '200':
          description: Authorized durable resource view; no Runtime startup required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebShellCwdOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    trustedTenant:
      type: apiKey
      in: header
      name: X-Qwen-Tenant-Id
      description: Injected by the trusted authenticated gateway, never trusted from browser input.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TurnId:
      name: turnId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    ListLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AfterSequence:
      name: after
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    EventLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
  headers:
    IdempotentReplay:
      schema: { type: boolean }
      description: True when the original result was returned for the same idempotency key and digest.
    RequestId:
      schema: { type: string, maxLength: 128 }
      description: Trace-only correlation identifier; never an idempotency key.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State, idempotency, or recovery conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource absent or outside the caller tenant scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CursorExpired:
      description: Replay cursor is older than the retained replay floor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    InputBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: { type: string, enum: [input_text] }
        text: { type: string, minLength: 1, maxLength: 1000000 }
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id: { type: string, minLength: 1, maxLength: 128 }
        agent_revision:
          type: [string, 'null']
          maxLength: 128
          description: Optional explicit revision; omitted resolves current revision atomically at admission.
        input:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/InputBlock' }
        metadata: { type: object, additionalProperties: true }
        stream:
          type: boolean
          default: false
          description: Phase one requires false; stream through the events route.
        workspace:
          $ref: '#/components/schemas/WorkspaceSelection'
          x-qwen-implementation-status: planned
          description: W0. If omitted, resolve and persist an explicit tenant default at first admission; no default
            means workspace_required. Replay must retain the original binding even if the default changes.
    SessionEventRequest:
      oneOf:
        - $ref: '#/components/schemas/InputMessageEventRequest'
        - $ref: '#/components/schemas/CancelEventRequest'
      discriminator:
        propertyName: type
    InputMessageEventRequest:
      type: object
      additionalProperties: false
      required: [type, input]
      properties:
        type: { const: agent.session.input.message }
        input:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/InputBlock' }
    CancelEventRequest:
      type: object
      additionalProperties: false
      required: [type, turn_id]
      properties:
        type: { const: agent.session.cancel }
        turn_id: { type: string, minLength: 1, maxLength: 64 }
    CommandAdmission:
      type: object
      required: [session_id, status, replayed]
      properties:
        session_id: { type: string, format: uuid }
        turn_id: { type: [string, 'null'], maxLength: 64 }
        status: { type: string }
        replayed: { type: boolean }
    PublicSession:
      type: object
      required: [id, object, agent_id, agent_revision, status, created_at, updated_at, last_event_id, capabilities]
      properties:
        id: { type: string, format: uuid }
        object: { const: agent.session }
        agent_id: { type: string }
        agent_revision: { type: string }
        status: { type: string, enum: [active, closing, closed, failed, recovery_blocked] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        metadata: { type: object, additionalProperties: true }
        active_turn: { oneOf: [{ $ref: '#/components/schemas/PublicTurn' }, { type: 'null' }] }
        last_event_id: { type: integer, format: int64, minimum: 0 }
        replay_floor_sequence: { type: integer, format: int64, minimum: 0, default: 0 }
        snapshot_through_sequence: { type: integer, format: int64, minimum: 0, default: 0 }
        capabilities:
          $ref: '#/components/schemas/SessionCapabilities'
        workspace:
          $ref: '#/components/schemas/WorkspaceContext'
          x-qwen-implementation-status: planned
          description: Absent for unbound legacy records, whose execution stays blocked pending evidence-based migration.
            Ready means committed context, not an active Runtime gate.
    SessionCapabilities:
      type: object
      additionalProperties: false
      required: [items, snapshots, artifacts, resync]
      properties:
        items: { type: boolean }
        snapshots: { type: boolean }
        artifacts: { type: boolean }
        resync: { type: boolean }
        workspace_context:
          type: boolean
          default: false
          x-qwen-implementation-status: planned
        cwd_change:
          type: boolean
          default: false
          x-qwen-implementation-status: planned
    PublicTurn:
      type: object
      required: [id, object, session_id, status, created_at]
      properties:
        id: { type: string, maxLength: 64 }
        object: { const: agent.turn }
        session_id: { type: string, format: uuid }
        input_item_id: { type: [string, 'null'], maxLength: 64 }
        status: { type: string, enum: [accepted, running, completed, failed, cancelled, recovery_blocked] }
        created_at: { type: integer, format: int64 }
        completed_at: { type: [integer, 'null'], format: int64 }
        error_code: { type: [string, 'null'], maxLength: 128 }
    PublicEvent:
      type: object
      required: [schema_version, projection_version, sequence, event_id, session_id, type, created_at, data, terminal]
      properties:
        schema_version: { type: integer, minimum: 1 }
